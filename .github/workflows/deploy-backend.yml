name: Deploy backend (Hugging Face Space)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "deploy/hf-space/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          DATABASE_URL: sqlite:///./ci_test.db

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the Space repository
        run: |
          mkdir -p space
          cp deploy/hf-space/README.md space/README.md
          cp backend/Dockerfile space/Dockerfile
          cp requirements.txt space/requirements.txt
          # One-off source-editing scripts in backend/ are not part of the app.
          rsync -a --exclude '__pycache__' --exclude 'append_*.py' --exclude 'fix_*.py' \
                backend/ space/backend/
          rm space/backend/Dockerfile

      - name: Build the image (catches a broken Dockerfile before the Space does)
        run: docker build -t sst-backend space

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Add the HF_TOKEN repository secret (see DEPLOY.md)"; exit 1; }
          test -n "$HF_SPACE" || { echo "::error::Add the HF_SPACE repository variable, e.g. your-name/soft-sensor-api"; exit 1; }
          cd space
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
